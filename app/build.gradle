plugins {
    id "com.android.application"
}

// OEM header blur is the normal path on supported ColorOS/OxygenOS builds. Pass
// -PforceGenericHeaderBlur=true when comparing the portable implementation.
def forceGenericHeaderBlur = project.findProperty("forceGenericHeaderBlur") == "true"
def forceGenericRadarBlur = project.findProperty("forceGenericRadarBlur") == "true"

android {
    namespace "com.zwerk.weather"
    compileSdk 36

    defaultConfig {
        applicationId "com.zwerk.weather"
        minSdk 28
        targetSdk 36
        versionCode 66
        versionName "1.5.1.1"
        testInstrumentationRunner "com.zwerk.weather.SettingsWidgetRegression"
        buildConfigField "boolean", "FORCE_GENERIC_HEADER_BLUR", forceGenericHeaderBlur.toString()
        buildConfigField "boolean", "FORCE_GENERIC_RADAR_BLUR", forceGenericRadarBlur.toString()
    }

    // The in-app language picker needs all packaged translations, including in Play builds.
    bundle {
        language {
            enableSplit = false
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly "androidx.annotation:annotation-jvm:1.11.0"
}
