plugins {
    id "com.android.application"
}

def forceGenericHeaderBlur = project.findProperty("forceGenericHeaderBlur") == "true"

android {
    namespace "com.zwerk.weather"
    compileSdk 36

    defaultConfig {
        applicationId "com.zwerk.weather"
        minSdk 28
        targetSdk 36
        versionCode 30
        // Keep the public label at 1.3.0 for subsequent builds; increment versionCode for updates.
        versionName "1.3.0"
        buildConfigField "boolean", "FORCE_GENERIC_HEADER_BLUR", forceGenericHeaderBlur.toString()
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
